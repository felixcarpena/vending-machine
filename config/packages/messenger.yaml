framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - Shared\Infrastructure\Bus\LoggingMiddleware
            query.bus:
                middleware:
                    - Shared\Infrastructure\Bus\LoggingMiddleware
            event.bus:
                default_middleware:
                    allow_no_handlers: true
                middleware:
                    - Shared\Infrastructure\Bus\LoggingMiddleware
