parameters:
    vending.slots:
        WATER: { product: WATER, price: 65, stock: 10 }
        JUICE: { product: JUICE, price: 100, stock: 10 }
        SODA: { product: SODA, price: 150, stock: 10 }
    vending.starting_change:
        5: 10
        10: 10
        25: 10

services:
    _defaults:
        autowire: true

    Vending\Application\StartMachine\StartMachineHandler:
        tags: [{ name: messenger.message_handler, bus: command.bus }]

    Vending\Application\ServiceMachine\ServiceMachineHandler:
        tags: [{ name: messenger.message_handler, bus: command.bus }]

    Vending\Application\GetMachineContents\GetMachineContentsHandler:
        tags: [{ name: messenger.message_handler, bus: query.bus }]

    Vending\Domain\StartingSetup:
        factory: ['Vending\Infrastructure\StartingSetupFromConfiguration', 'read']
        arguments: ['%vending.slots%', '%vending.starting_change%']

    Vending\Infrastructure\InMemoryVendingMachineRepository:
        arguments: []

    Vending\Domain\VendingMachineRepository: '@Vending\Infrastructure\InMemoryVendingMachineRepository'

    Shared\Infrastructure\Bus\LoggingMiddleware:
        arguments: ['@monolog.logger.bus']

    Shared\Infrastructure\Bus\MessengerCommandBus:
        arguments: ['@command.bus']

    Shared\Infrastructure\Bus\MessengerQueryBus:
        arguments: ['@query.bus']

    Shared\Infrastructure\Bus\MessengerEventBus:
        arguments: ['@event.bus']

    Shared\Application\Bus\CommandBus: '@Shared\Infrastructure\Bus\MessengerCommandBus'
    Shared\Application\Bus\QueryBus: '@Shared\Infrastructure\Bus\MessengerQueryBus'
    Shared\Application\Bus\EventBus: '@Shared\Infrastructure\Bus\MessengerEventBus'

    Vending\UI\Cli\VendingMachineCommand:
        autoconfigure: true
